name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ["apps-script/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret이 등록되지 않아 배포를 건너뜀"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push & redeploy (같은 웹앱 주소 유지)
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: AKfycbwla5mb0trJEJB2dSDtvO2mHRLtQn551CBr0NhjY008w4_UW9pqgQ3UFxUhpQ8qRfE
        run: |
          clasp push -f
          clasp update-deployment "$DEPLOYMENT_ID" -d "ci ${GITHUB_SHA::7}"
